name: Linux - Secrets
on:
  push:
    branches: [linux]
  pull_request:
    branches: [linux]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - name: Check files, archives, JSON credentials and Ulauncher snapshot
        run: bash tests/check-no-secrets.sh
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan git history with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
