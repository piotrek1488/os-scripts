name: Python generator smoke test
on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test generator in temporary directory
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(mktemp -d)"
          trap 'rm -rf "$workspace"' EXIT

          cd "$workspace"
          bash "$GITHUB_WORKSPACE/new_python_proj_setup.sh" ci_demo
          cd ci_demo

          echo "=== Generated project structure ==="
          find . -maxdepth 3 -type f | sort

          echo "=== Checking required files ==="
          for file in \
            main.py \
            src/__init__.py \
            src/main_module.py \
            src/config.py \
            src/module1.py \
            src/module2.py \
            tests/test_basic.py; do

            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

          if [[ -e "src/\$file" ]]; then
            echo "::error::Unexpected literal filename"
            exit 1
          fi

          echo "=== Compile Python ==="
          python -m compileall -q .

          echo "=== Run application ==="
          python main.py

          echo "=== Run tests ==="
          python -m pip install pytest
          python -m pytest -q
      - name: Verify missing argument fails cleanly
        shell: bash
        run: |
          if bash new_python_proj_setup.sh; then
            echo 'Generator should reject a missing name' >&2
            exit 1
          fi
